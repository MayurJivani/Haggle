# Coolify on Jinx (FRC/DEPLOY.md). Host network: the app listens on 4371 like
# its old systemd unit did, so its Caddy block, Postgres URL and env file are unchanged.
services:
  haggle:
    image: ghcr.io/mayurjivani/haggle:latest
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    command: ["node", "apps/server/dist/index.js"]
    env_file:
      - path: /etc/apps/haggle.env
        required: false
    environment:
      NODE_ENV: "production"
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
